name: Popup stability (Chromium and WebKit)

on:
  push:
    paths:
      - 'custom_components/vega_home/frontend/**'
      - 'tests/popup_fixture.html'
      - 'tests/test_popup_stability.py'
      - '.github/workflows/popup-stability.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright browsers
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium webkit
      - name: Run popup stability suite
        env:
          VEGA_TEST_BROWSERS: chromium,webkit
        run: python tests/test_popup_stability.py
